services:
  - type: web
    name: tsp-route-optimizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SOCKETIO_ASYNC_MODE
        value: gevent
      - key: JWT_SECRET
        generateValue: true        # Render injects a long random secret
